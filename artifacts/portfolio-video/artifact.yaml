name: portfolio-video
description: "Reetika Tomer Portfolio Video"
kind: video

access:
  type: stack
  name: PNPM_WORKSPACE

service_configs:
  - name: web
    development:
      run: pnpm --filter @workspace/portfolio-video run dev
    production:
      serve: static
      build:
        - pnpm
        - --filter
        - '@workspace/portfolio-video'
        - run
        - build
      publicDir: artifacts/portfolio-video/dist/public
      rewrites:
        - from: "/*"
          to: /index.html
